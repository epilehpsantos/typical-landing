<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typical, four short videos</title>
<style>
  :root{
    --canvas:#FFFFFF; --stage:#F5F5F5; --ink:#000; --ink-2:rgba(60,60,67,.6); --ink-3:rgba(60,60,67,.3);
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,"DM Mono",monospace;
    --serif:"New York","Iowan Old Style",Georgia,"Times New Roman",serif;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
  main{max-width:640px;margin:0 auto;padding:clamp(56px,10vw,120px) 24px}
  .mono{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
  h1{font-weight:400;font-size:clamp(28px,4.2vw,48px);letter-spacing:-.02em;line-height:1.12;margin:12px 0 36px}
  ul{list-style:none;margin:0;padding:0}
  li{border-top:1px solid var(--ink-3)}
  li:last-child{border-bottom:1px solid var(--ink-3)}
  li a{display:block;padding:18px 0;font-size:clamp(20px,2.2vw,24px);letter-spacing:-.01em;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
  li a:hover{text-decoration:underline}
</style>
</head>
<body>
<main>
  <a class="mono" href="/">Typical</a>
  <h1>Typical, four short videos</h1>
  <ul>
    <li><a href="https://youtu.be/5p-M_vkfRhw" target="_blank" rel="noopener">The keyboard answering a client</a></li>
    <li><a href="https://youtu.be/Vb9ow8trpHQ" target="_blank" rel="noopener">The recap</a></li>
    <li><a href="https://youtu.be/WUN6ymE2q6c" target="_blank" rel="noopener">Uploading a listing</a></li>
    <li><a href="https://youtu.be/-LEAtmyAxHg" target="_blank" rel="noopener">Intro</a></li>
  </ul>
</main>
</body>
</html>
